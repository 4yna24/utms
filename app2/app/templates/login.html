{% extends "base.html" %}

{% block title %}{{ page_title or 'Login' }} - Uni System{% endblock %}

{% block content %}
    <section class="window-shell auth-shell">
        <div class="window-body">
            <h1>{{ form_title or 'Login' }}</h1>
            <p class="subline">Enter your credentials to continue.</p>

            <form method="POST">
                <div>
                    <label>Email</label><br>
                    <input type="email" name="email" required>
                </div>
                <br>
                <div>
                    <label>Password</label><br>
                    <input type="password" name="password" required>
                </div>
                <br>
                {% if show_role_selector %}
                    <div>
                        <label>Role</label><br>
                        <select name="role" required>
                            <option value="">Select role</option>
                            {% for role in roles %}
                                <option value="{{ role.slug }}" {% if role_value == role.slug %}selected{% endif %}>{{ role.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <br>
                {% else %}
                    <input type="hidden" name="role" value="{{ role_value }}">
                {% endif %}

                <button type="submit">{{ submit_label or 'Login' }}</button>
            </form>
            <p>Don't have an account? <a href="{{ url_for(register_link_endpoint or 'auth.register') }}">Register here</a>.</p>
        </div>
    </section>
{% endblock %}

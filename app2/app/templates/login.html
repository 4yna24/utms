{% extends "base.html" %}

{% block title %}{{ role_name }} Login - Uni System{% endblock %}

{% block content %}
    <h1>{{ role_name }} Login</h1>
    <p>Please enter your credentials to access the {{ role_name }} portal.</p>
    
    <form method="POST">
        <div>
            <label>Email:</label><br>
            <input type="email" name="email" required>
        </div>
        <br>
        <div>
            <label>Password:</label><br>
            <input type="password" name="password" required>
        </div>
        <br>
        <button type="submit">Login</button>
    </form>

    <p>Don't have an account? <a href="{{ url_for(register_endpoint) }}">Register here</a>.</p>
{% endblock %}

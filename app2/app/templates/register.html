{% extends "base.html" %}

{% block title %}{{ role_name }} Register - Uni System{% endblock %}

{% block content %}
    <h1>Create {{ role_name }} Account</h1>
    <form method="POST">
        <label>Email:</label><br>
        <input type="email" name="email" required><br><br>
        
        <label>Password:</label><br>
        <input type="password" name="password" required><br><br>
        
        <button type="submit">Register</button>
    </form>

    <p>Already have an account? <a href="{{ url_for(login_endpoint) }}">Login here</a>.</p>
{% endblock %}
